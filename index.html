<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, height=282, initial-scale=1.0, user-scalable=no">
<title>Claude Usage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 240px;
    height: 282px;
    overflow: hidden;
    background: #000000;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #f5f5f5;
  }

  #app {
    width: 240px;
    height: 282px;
    position: relative;
  }

  /* ---------- Screen: Usage ---------- */
  .screen {
    width: 240px;
    height: 282px;
    display: none;
    flex-direction: column;
    padding: 10px 12px 8px 12px;
  }
  .screen.active { display: flex; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .header .title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #FF6A00; /* rabbit orange accent */
    text-transform: uppercase;
  }
  .header .updated {
    font-size: 8px;
    color: #666;
  }

  .metric {
    background: #121212;
    border: 1px solid #262626;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .metric.selected {
    border-color: #FF6A00;
  }
  .metric-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .metric-label {
    font-size: 10px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .metric-pct {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }
  .metric-pct.good { color: #4ADE80; }
  .metric-pct.caution { color: #FBBF24; }
  .metric-pct.critical { color: #F87171; }

  .bar-track {
    width: 100%;
    height: 6px;
    background: #262626;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .bar-fill.good { background: #4ADE80; }
  .bar-fill.caution { background: #FBBF24; }
  .bar-fill.critical { background: #F87171; }

  .metric-sub {
    font-size: 8px;
    color: #777;
    display: flex;
    justify-content: space-between;
  }

  .footer-hint {
    margin-top: auto;
    text-align: center;
    font-size: 8px;
    color: #555;
    padding-top: 4px;
  }

  /* ---------- Screen: Settings / Manual Entry ---------- */
  .settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid #1c1c1c;
  }
  .settings-row.focused {
    background: #1a1a1a;
    border-radius: 4px;
  }
  .settings-row .label {
    font-size: 10px;
    color: #ccc;
  }
  .settings-row .value {
    font-size: 12px;
    font-weight: 700;
    color: #FF6A00;
  }

  .settings-title {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .settings-hint {
    margin-top: auto;
    font-size: 8px;
    color: #555;
    text-align: center;
    line-height: 1.4;
  }

  /* ---------- Loading dots ---------- */
  .dots span {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #FF6A00;
    margin: 0 2px;
    animation: blink 1.2s infinite ease-in-out both;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
</style>
</head>
<body>

<div id="app">

  <!-- MAIN USAGE SCREEN -->
  <div id="screen-usage" class="screen active">
    <div class="header">
      <span class="title">Claude Usage</span>
      <span class="updated" id="updatedAt">--:--</span>
    </div>

    <div class="metric" id="metric-session" data-index="0">
      <div class="metric-top">
        <span class="metric-label">Session (5h)</span>
        <span class="metric-pct" id="sessionPct">--%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="sessionBar" style="width:0%"></div></div>
      <div class="metric-sub">
        <span id="sessionRemaining">-- left</span>
        <span id="sessionReset">resets --:--</span>
      </div>
    </div>

    <div class="metric" id="metric-weekly" data-index="1">
      <div class="metric-top">
        <span class="metric-label">Weekly</span>
        <span class="metric-pct" id="weeklyPct">--%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="weeklyBar" style="width:0%"></div></div>
      <div class="metric-sub">
        <span id="weeklyRemaining">-- left</span>
        <span id="weeklyReset">resets --</span>
      </div>
    </div>

    <div class="footer-hint" id="mainHint">scroll ↕ · click=settings · hold=sync</div>
  </div>

  <!-- SETTINGS / MANUAL ENTRY SCREEN -->
  <div id="screen-settings" class="screen">
    <div class="settings-title">Set Usage %</div>

    <div class="settings-row" id="row-session" data-index="0">
      <span class="label">Session</span>
      <span class="value" id="setSessionVal">45%</span>
    </div>
    <div class="settings-row" id="row-weekly" data-index="1">
      <span class="label">Weekly</span>
      <span class="value" id="setWeeklyVal">32%</span>
    </div>
    <div class="settings-row" id="row-back" data-index="2">
      <span class="label">◂ Back to usage</span>
      <span class="value"></span>
    </div>

    <div class="settings-hint">
      scroll ↕ to move · hold PTT + scroll to adjust value · click row to select
    </div>
  </div>

</div>

<script>
/* ===========================================================
   Claude Usage Monitor — R1 Creation
   Screen: 240x282 fixed. Nav: scroll wheel + side (PTT) button.
   Storage: window.creationStorage (R1 SDK), not localStorage.
   ===========================================================

   DATA SOURCE — LIVE, via self-hosted proxy
   ------------------------------------------------------------
   getUsageData() fetches from PROXY_URL (set below). The proxy
   holds your claude.ai sessionKey server-side and returns clean
   JSON, so the R1 device never sees your session key and never
   fights CORS. See /proxy in the repo for the server code.

   Set PROXY_URL to your deployed proxy, e.g.:
     https://your-app.onrender.com/usage?key=YOUR_SHARED_SECRET
   =========================================================== */

const PROXY_URL = ''; // <-- SET THIS after deploying the proxy (see README)
const FETCH_TIMEOUT_MS = 8000;

// ---------- Storage helpers (R1 creationStorage, base64 JSON) ----------
const STORAGE_KEY = 'claude_usage_state';

function hasR1Storage() {
  return typeof window.creationStorage !== 'undefined' && window.creationStorage.plain;
}

async function saveState(state) {
  const json = JSON.stringify(state);
  if (hasR1Storage()) {
    try {
      const encoded = btoa(json);
      await window.creationStorage.plain.setItem(STORAGE_KEY, encoded);
      return;
    } catch (e) {
      console.error('creationStorage save failed, falling back', e);
    }
  }
  // Fallback for testing in a regular browser (not present on-device)
  try { localStorage.setItem(STORAGE_KEY, json); } catch (e) {}
}

async function loadState() {
  if (hasR1Storage()) {
    try {
      const encoded = await window.creationStorage.plain.getItem(STORAGE_KEY);
      if (encoded) return JSON.parse(atob(encoded));
    } catch (e) {
      console.error('creationStorage load failed, falling back', e);
    }
  }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

// ---------- Live data source (via proxy) ----------
async function getUsageData(manualOverride) {
  if (manualOverride) {
    return {
      session: manualOverride.session,
      weekly: manualOverride.weekly,
      sessionResetMinutes: manualOverride.sessionResetMinutes ?? 180,
      weeklyResetDays: manualOverride.weeklyResetDays ?? 3,
      source: 'manual'
    };
  }

  if (!PROXY_URL) {
    // Not configured yet — fall back to whatever is in state/defaults.
    return {
      session: state.session,
      weekly: state.weekly,
      sessionResetMinutes: state.sessionResetMinutes,
      weeklyResetDays: state.weeklyResetDays,
      source: 'unconfigured'
    };
  }

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

    const resp = await fetch(PROXY_URL, { signal: controller.signal });
    clearTimeout(timeout);

    if (!resp.ok) throw new Error('proxy returned ' + resp.status);
    const json = await resp.json();

    if (!json.session || !json.weekly) {
      throw new Error('proxy response missing session/weekly data');
    }

    const sessionResetMinutes = minutesUntil(json.session.resetsAt) ?? state.sessionResetMinutes;
    const weeklyResetDays = daysUntil(json.weekly.resetsAt) ?? state.weeklyResetDays;

    return {
      session: clamp(json.session.usedPercent, 0, 100),
      weekly: clamp(json.weekly.usedPercent, 0, 100),
      sessionResetMinutes,
      weeklyResetDays,
      source: 'live'
    };
  } catch (err) {
    console.error('getUsageData failed, keeping last known values:', err.message);
    return {
      session: state.session,
      weekly: state.weekly,
      sessionResetMinutes: state.sessionResetMinutes,
      weeklyResetDays: state.weeklyResetDays,
      source: 'error',
      error: err.message
    };
  }
}

function minutesUntil(isoString) {
  if (!isoString) return null;
  const diffMs = new Date(isoString).getTime() - Date.now();
  if (Number.isNaN(diffMs)) return null;
  return Math.max(0, Math.round(diffMs / 60000));
}

function daysUntil(isoString) {
  if (!isoString) return null;
  const diffMs = new Date(isoString).getTime() - Date.now();
  if (Number.isNaN(diffMs)) return null;
  return Math.max(0, Math.round(diffMs / 86400000));
}

// ---------- App state ----------
let state = {
  session: 45,
  weekly: 32,
  sessionResetMinutes: 180,
  weeklyResetDays: 3
};

let currentScreen = 'usage'; // 'usage' | 'settings'
let usageFocusIndex = 0;     // 0 = session, 1 = weekly (for possible future per-card actions)
let settingsFocusIndex = 0;  // 0 = session row, 1 = weekly row, 2 = back row
let adjustMode = false;      // true while holding PTT to adjust a value in settings

const screens = {
  usage: document.getElementById('screen-usage'),
  settings: document.getElementById('screen-settings')
};

// ---------- Render ----------
function levelClass(pct) {
  if (pct >= 80) return 'critical';
  if (pct >= 50) return 'caution';
  return 'good';
}

function renderUsageScreen() {
  const s = state.session, w = state.weekly;

  document.getElementById('sessionPct').textContent = s + '%';
  document.getElementById('sessionPct').className = 'metric-pct ' + levelClass(s);
  document.getElementById('sessionBar').style.width = s + '%';
  document.getElementById('sessionBar').className = 'bar-fill ' + levelClass(s);
  document.getElementById('sessionRemaining').textContent = (100 - s) + '% left';
  document.getElementById('sessionReset').textContent = 'resets ' + formatMinutes(state.sessionResetMinutes);

  document.getElementById('weeklyPct').textContent = w + '%';
  document.getElementById('weeklyPct').className = 'metric-pct ' + levelClass(w);
  document.getElementById('weeklyBar').style.width = w + '%';
  document.getElementById('weeklyBar').className = 'bar-fill ' + levelClass(w);
  document.getElementById('weeklyRemaining').textContent = (100 - w) + '% left';
  document.getElementById('weeklyReset').textContent = 'resets in ' + state.weeklyResetDays + 'd';

  const now = new Date();
  document.getElementById('updatedAt').textContent =
    now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

  // highlight focused metric card
  document.getElementById('metric-session').classList.toggle('selected', usageFocusIndex === 0);
  document.getElementById('metric-weekly').classList.toggle('selected', usageFocusIndex === 1);
}

function renderSettingsScreen() {
  document.getElementById('setSessionVal').textContent = state.session + '%';
  document.getElementById('setWeeklyVal').textContent = state.weekly + '%';

  const rows = ['row-session', 'row-weekly', 'row-back'];
  rows.forEach((id, i) => {
    document.getElementById(id).classList.toggle('focused', settingsFocusIndex === i);
  });
}

function switchScreen(name) {
  currentScreen = name;
  screens.usage.classList.toggle('active', name === 'usage');
  screens.settings.classList.toggle('active', name === 'settings');
  if (name === 'usage') renderUsageScreen();
  if (name === 'settings') renderSettingsScreen();
}

function formatMinutes(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

// ---------- Hardware input: scroll wheel + PTT (sideClick) ----------
// scrollUp / scrollDown: navigate focus
// sideClick: select / toggle screen
// longPressStart + scroll (while held): adjust value in settings (adjustMode)

window.addEventListener('scrollUp', () => handleScroll(-1));
window.addEventListener('scrollDown', () => handleScroll(1));
window.addEventListener('sideClick', handleSelect);
window.addEventListener('longPressStart', handleLongPressStart);
window.addEventListener('longPressEnd', () => { adjustMode = false; saveState(state); });

function handleLongPressStart() {
  if (currentScreen === 'usage') {
    // Long-press on main screen = force an immediate sync
    const hint = document.getElementById('mainHint');
    hint.textContent = 'syncing...';
    syncUsage().then(() => {
      hint.textContent = 'scroll ↕ · click=settings · hold=sync';
    });
    return;
  }
  adjustMode = true;
}

function handleScroll(direction) {
  if (currentScreen === 'usage') {
    usageFocusIndex = clamp(usageFocusIndex + direction, 0, 1);
    renderUsageScreen();
    return;
  }

  if (currentScreen === 'settings') {
    if (adjustMode) {
      // adjust the focused row's value in steps of 5
      if (settingsFocusIndex === 0) {
        state.session = clamp(state.session - direction * 5, 0, 100);
      } else if (settingsFocusIndex === 1) {
        state.weekly = clamp(state.weekly - direction * 5, 0, 100);
      }
      renderSettingsScreen();
    } else {
      settingsFocusIndex = clamp(settingsFocusIndex + direction, 0, 2);
      renderSettingsScreen();
    }
  }
}

function handleSelect() {
  if (currentScreen === 'usage') {
    switchScreen('settings');
    return;
  }

  if (currentScreen === 'settings') {
    if (settingsFocusIndex === 2) {
      // Back row
      saveState(state);
      switchScreen('usage');
    }
    // rows 0/1: click just confirms focus; actual adjust is via long-press+scroll
  }
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

// ---------- Sync ----------
const AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 minutes — keep gentle on the proxy/device

async function syncUsage() {
  const data = await getUsageData(null);
  state.session = data.session;
  state.weekly = data.weekly;
  state.sessionResetMinutes = data.sessionResetMinutes;
  state.weeklyResetDays = data.weeklyResetDays;
  await saveState(state);
  if (currentScreen === 'usage') renderUsageScreen();
}

// ---------- Init ----------
async function init() {
  const saved = await loadState();
  if (saved) {
    state = { ...state, ...saved };
    renderUsageScreen();
  }
  // Always attempt a live sync on load (falls back gracefully if unconfigured/offline)
  await syncUsage();
  setInterval(syncUsage, AUTO_REFRESH_MS);
}

init();
</script>

</body>
</html>
